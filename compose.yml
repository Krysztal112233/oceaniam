services:
  postgres:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    command: -c 'max_connections=2048'
    volumes:
      - postgres:/var/lib/postgresql/18/docker
    env_file:
      - .env
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend-migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./config.toml:/app/config.toml:ro
    ports:
      - 8000:8000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
