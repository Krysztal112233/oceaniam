[package]
name = "oceaniam-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
const_format = "0.2"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
snafu = "0.8"
tap = "1.0"
tracing = "0.1"
uuid = { version = "1.18", features = ["v7"] }

oceaniam-vo = { path = "../../backend/crates/oceaniam-vo" }
oceaniam-api = { path = "../../backend/crates/oceaniam-api" }
