[workspace]
members = [
	"crates/migration",
	"crates/oceaniam",
	"crates/oceaniam-common",
	"crates/oceaniam-credential",
	"crates/oceaniam-database",
	"crates/oceaniam-export",
	"crates/oceaniam-keybox",
	"crates/oceaniam-vo",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
chrono = "0.4"
clap = { version = "*", features = ["derive"] }
config = { version = "0.15", features = ["toml"] }
garde = { version = "*", features = ["derive", "phone-number", "email"] }
itertools = "0.14"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
log = "0.4"
mimalloc = { version = "0.1", features = ["v3"] }
rand = "0.8"
rsa = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
tap = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = { version = "2.5", features = ["serde"] }
utoipa = { version = "*", features = ["chrono", "url", "uuid", "axum_extras"] }
utoipa-axum = "*"
utoipa-scalar = { version = "*", features = ["axum"] }
uuid = { version = "1.18", features = ["v7"] }

migration = { path = "./crates/migration/" }
oceaniam-common = { path = "./crates/oceaniam-common/" }
oceaniam-credential = { path = "./crates/oceaniam-credential/" }
oceaniam-database = { path = "./crates/oceaniam-database/" }
oceaniam-export = { path = "./crates/oceaniam-export/" }
oceaniam-keybox = { path = "./crates/oceaniam-keybox/" }
oceaniam-vo = { path = "./crates/oceaniam-vo/" }

[workspace.dependencies.ts-rs]
version = "11.1"
features = ["uuid-impl", "serde-json-impl", "chrono-impl"]

[workspace.dependencies.sea-orm]
version = "1.1"
features = ["runtime-tokio", "sqlx-postgres"]

[workspace.dependencies.sea-orm-migration]
version = "1.1"
features = ["runtime-tokio", "sqlx-postgres"]

[workspace.dependencies.axum-valid]
default-features = false
features = ["basic", "garde"]
version = "0.24"
