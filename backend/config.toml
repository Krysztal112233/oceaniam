addr = "0.0.0.0:8000"
# Required: inject OCEANIAM_MASTER_KEY with a generated 64-char hex key.
# Generate with: openssl rand -hex 32
master_key = ""

# Required by the API server. Keep every key version until all stored secrets have upgraded.
# Generate each key with: openssl rand -hex 32
# [application_secret_hmac]
# current_version = 1
# [application_secret_hmac.keys]
# 1 = "<64-character-hex-key>"

[database]
slow_statements_logging_threshold = 200
max_connections = 128
min_connections = 4

[cors]
allow_origin = "http://localhost:5173"

[cookie]
secure = false

[telemetry]
enabled = false
service_name = "oceaniam"
# Full OTLP/HTTP protobuf endpoints; paths are used as-is.
# otlp_endpoint = "http://localhost:4318/v1/logs"
# otlp_traces_endpoint = "http://localhost:4318/v1/traces"
# [telemetry.otlp_headers]
# Authorization = "Bearer ..."

[workers]
